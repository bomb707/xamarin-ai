[project]
name = "xamarinbot"
version = "2.0.0"
description = "Xamarinbot V2 - semi-controlled BTC 5-minute trading strategy (Polymarket)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["httpx>=0.27", "websockets>=12.0"]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
